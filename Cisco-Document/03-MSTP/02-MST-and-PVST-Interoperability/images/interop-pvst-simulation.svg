<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="410.0" y="28.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">PVST simulation on the boundary port</text><rect x="30" y="80" width="300" height="200" rx="12" fill="#ebf8ff" stroke="#2b6cb0"/><text x="180.0" y="108.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2b6cb0">MST region</text><text x="180.0" y="130.0" text-anchor="middle" font-size="12" fill="#1a202c">IST (instance 0) information</text><rect x="80" y="150" width="200" height="50" rx="8" fill="#2c7a7b" stroke="none"/><text x="180.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MST switch</text><text x="180.0" y="236.0" text-anchor="middle" font-size="12" font-weight="700" fill="#c53030">boundary port</text><rect x="560" y="120" width="220" height="120" rx="12" fill="#f7fafc" stroke="#a0aec0"/><rect x="610" y="150" width="120" height="50" rx="8" fill="#2c7a7b" stroke="none"/><text x="670.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PVST+</text><text x="670.0" y="226.0" text-anchor="middle" font-size="12" fill="#1a202c">one BPDU per VLAN</text><line x1="285.0" y1="165.0" x2="605.0" y2="165.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ab)"/><text x="445.0" y="150.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">PVST+ BPDU for every VLAN</text><text x="445.0" y="128.0" text-anchor="middle" font-size="11" fill="#2b6cb0">all carry the same IST root</text><line x1="605.0" y1="190.0" x2="285.0" y2="190.0" stroke="#38a169" stroke-width="2.5" marker-end="url(#ag)"/><text x="445.0" y="214.0" text-anchor="middle" font-size="12" font-weight="700" fill="#38a169">PVST+ BPDUs (VLAN 1, 10, 20 ...)</text><text x="445.0" y="232.0" text-anchor="middle" font-size="11" fill="#38a169">VLAN 1 BPDU decides the port role</text><text x="410.0" y="320.0" text-anchor="middle" font-size="12" font-weight="700" fill="#e53e3e">Disagreement between the two sides → PVST inconsistency → port BKN (broken)</text></svg>
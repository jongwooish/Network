ill="#1a202c">H2</text><line x1="172.0" y1="270.0" x2="268.0" y2="210.0" stroke="#2d3748" stroke-width="2"/><text x="206.2" y="228.7" text-anchor="middle" font-size="10.5" fill="#c53030">1000 Mbit</text><rect x="650" y="114" width="40" height="28" rx="4" fill="#edf2f7" stroke="#a0aec0"/><rect x="662" y="142" width="16" height="5" rx="1" fill="#a0aec0" stroke="none"/><text x="670.0" y="133.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">H3</text><line x1="648.0" y1="130.0" x2="552.0" y2="190.0" stroke="#2d3748" stroke-width="2"/><text x="586.2" y="148.7" text-anchor="middle" font-size="10.5" fill="#c53030">1000 Mbit</text><rect x="650" y="254" width="40" height="28" rx="4" fill="#edf2f7" stroke="#a0aec0"/><rect x="662" y="282" width="16" height="5" rx="1" fill="#a0aec0" stroke="none"/><text x="670.0" y="273.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">H4</text><line x1="648.0" y1="270.0" x2="552.0" y2="210.0" stroke="#2d3748" stroke-width="2"/><text x="613.8" y="228.7" text-anchor="middle" font-size="10.5" fill="#c53030">1000 Mbit</text><line x1="332.0" y1="200.0" x2="488.0" y2="200.0" stroke="#2d3748" stroke-width="2"/><text x="410.0" y="192.0" text-anchor="middle" font-size="11" font-weight="700" fill="#c53030">1000 Mbit</text><line x1="346.0" y1="170.0" x2="474.0" y2="170.0" stroke="#38a169" stroke-width="2.5" marker-end="url(#ag)"/><text x="410.0" y="162.0" text-anchor="middle" font-size="12" font-weight="700" fill="#38a169">H1 → H3: 800 Mbit</text><line x1="346.0" y1="230.0" x2="474.0" y2="230.0" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#ab)"/><text x="410.0" y="246.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">H2 → H4: 600 Mbit</text><text x="410.0" y="330.0" text-anchor="middle" font-size="13" font-weight="700" fill="#c53030">800 + 600 = 1400 Mbit needed, but the link carries only 1000 Mbit</text><text x="410.0" y="352.0" text-anchor="middle" font-size="12" fill="#1a202c">T
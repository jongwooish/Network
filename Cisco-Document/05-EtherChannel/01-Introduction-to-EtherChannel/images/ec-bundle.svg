ll="#1a202c">H2</text><line x1="172.0" y1="260.0" x2="268.0" y2="200.0" stroke="#2d3748" stroke-width="2"/><text x="206.2" y="218.7" text-anchor="middle" font-size="10.5" fill="#c53030">1000 Mbit</text><rect x="650" y="104" width="40" height="28" rx="4" fill="#edf2f7" stroke="#a0aec0"/><rect x="662" y="132" width="16" height="5" rx="1" fill="#a0aec0" stroke="none"/><text x="670.0" y="123.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">H3</text><line x1="648.0" y1="120.0" x2="552.0" y2="180.0" stroke="#2d3748" stroke-width="2"/><text x="586.2" y="138.7" text-anchor="middle" font-size="10.5" fill="#c53030">1000 Mbit</text><rect x="650" y="244" width="40" height="28" rx="4" fill="#edf2f7" stroke="#a0aec0"/><rect x="662" y="272" width="16" height="5" rx="1" fill="#a0aec0" stroke="none"/><text x="670.0" y="263.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">H4</text><line x1="648.0" y1="260.0" x2="552.0" y2="200.0" stroke="#2d3748" stroke-width="2"/><text x="613.8" y="218.7" text-anchor="middle" font-size="10.5" fill="#c53030">1000 Mbit</text><ellipse cx="410.0" cy="190" rx="80.0" ry="34" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="7 5"/><text x="410.0" y="148.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">Port-channel 1</text><line x1="332.0" y1="178.0" x2="488.0" y2="178.0" stroke="#2d3748" stroke-width="2"/><line x1="332.0" y1="202.0" x2="488.0" y2="202.0" stroke="#2d3748" stroke-width="2"/><text x="410.0" y="250.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">2 × 1000 Mbit, one logical link</text><text x="410.0" y="330.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1a202c">Spanning tree sees one link, so nothing is blocked</text><text x="410.0" y="352.0" text-anchor="middle" font-size="12" fill="#1a202c">Traffic is load-balanced over both links; if one fails, the other keeps working</text></svg>
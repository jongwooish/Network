<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <g id="pc">
      <rect x="-24" y="-20" width="48" height="32" rx="4" fill="#4a5568"/>
      <rect x="-19" y="-15" width="38" height="22" rx="2" fill="#e2e8f0"/>
      <rect x="-14" y="14" width="28" height="6" rx="2" fill="#4a5568"/>
    </g>
    <g id="sw">
      <rect x="-48" y="-24" width="96" height="48" rx="8" fill="#2b6cb0"/>
      <path d="M-24 -6 h48 l-6 -5 M24 6 h-48 l6 5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="800" height="200" fill="#ffffff"/>
  <line x1="100" y1="90" x2="250" y2="90" stroke="#718096" stroke-width="3"/>
  <line x1="550" y1="90" x2="700" y2="90" stroke="#718096" stroke-width="3"/>
  <line x1="298" y1="90" x2="502" y2="90" stroke="#dd6b20" stroke-width="5"/>
  <text x="400" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#c05621">Trunk (802.1Q)</text>

  <use href="#pc" x="70" y="90"/>
  <text x="70" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">VPC3</text>
  <text x="70" y="160" text-anchor="middle" font-size="13" fill="#4a5568">192.168.1.1/24</text>
  <use href="#sw" x="250" y="90"/><text x="250" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">SW1</text>
  <use href="#sw" x="550" y="90"/><text x="550" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">SW2</text>
  <use href="#pc" x="730" y="90"/>
  <text x="730" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1a202c">VPC4</text>
  <text x="730" y="160" text-anchor="middle" font-size="13" fill="#4a5568">192.168.1.2/24</text>

  <g font-size="12" fill="#2d3748" text-anchor="middle">
    <rect x="148" y="98" width="52" height="20" rx="10" fill="#edf2f7" stroke="#a0aec0"/><text x="174" y="112">Gi0/0</text>
    <rect x="304" y="98" width="52" height="20" rx="10" fill="#edf2f7" stroke="#a0aec0"/><text x="330" y="112">Gi0/1</text>
    <rect x="444" y="98" width="52" height="20" rx="10" fill="#edf2f7" stroke="#a0aec0"/><text x="470" y="112">Gi0/0</text>
    <rect x="600" y="98" width="52" height="20" rx="10" fill="#edf2f7" stroke="#a0aec0"/><text x="626" y="112">Gi0/1</text>
  </g>
  <text x="400" y="188" text-anchor="middle" font-size="12" fill="#718096">VPC3·VPC4 = VLAN 50 (Computers) Access 포트 · SW1 ↔ SW2 = Trunk</text>
</svg>

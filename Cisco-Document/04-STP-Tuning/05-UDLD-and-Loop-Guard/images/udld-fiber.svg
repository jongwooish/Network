<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="620" height="250" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="310.0" y="28.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">A fiber link uses separate transmit and receive strands</text><rect x="78" y="100" width="64" height="40" rx="7" fill="#2c7a7b" stroke="none"/><text x="110.0" y="125.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">SW2</text><rect x="478" y="100" width="64" height="40" rx="7" fill="#2c7a7b" stroke="none"/><text x="510.0" y="125.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">SW3</text><line x1="150.0" y1="105.0" x2="470.0" y2="105.0" stroke="#d69e2e" stroke-width="4" marker-end="url(#ak)"/><line x1="470.0" y1="135.0" x2="150.0" y2="135.0" stroke="#2b6cb0" stroke-width="4" marker-end="url(#ak)"/><text x="310.0" y="95.0" text-anchor="middle" font-size="12" font-weight="700" fill="#d69e2e">TX → RX</text><text x="310.0" y="158.0" text-anchor="middle" font-size="12" font-weight="700" fill="#2b6cb0">RX ← TX</text><text x="310.0" y="215.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">If one strand fails, traffic still flows in the other direction: a unidirectional link</text></svg>
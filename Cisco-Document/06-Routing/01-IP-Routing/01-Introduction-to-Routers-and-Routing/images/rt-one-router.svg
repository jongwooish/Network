<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="860" height="390" fill="#ffffff"/><defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38a169"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53e3e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs><text x="430.0" y="28.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1a202c">One router, two directly connected networks</text><rect x="90" y="104" width="40" height="28" rx="4" fill="#edf2f7" stroke="#a0aec0"/><rect x="102" y="132" width="16" height="5" rx="1" fill="#a0aec0" stroke="none"/><text x="110.0" y="123.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">H1</text><text x="110.0" y="154.0" text-anchor="middle" font-size="11" fill="#4a5568">192.168.1.1</text><rect x="730" y="104" width="40" height="28" rx="4" fill="#edf2f7" stroke="#a0aec0"/><rect x="742" y="132" width="16" height="5" rx="1" fill="#a0aec0" stroke="none"/><text x="750.0" y="123.0" text-anchor="middle" font-size="11" font-weight="700" fill="#1a202c">H2</text><text x="750.0" y="154.0" text-anchor="middle" font-size="11" fill="#4a5568">192.168.2.2</text><text x="110.0" y="170.0" text-anchor="middle" font-size="10.5" fill="#4a5568">gateway 192.168.1.254</text><text x="750.0" y="170.0" text-anchor="middle" font-size="10.5" fill="#4a5568">gateway 192.168.2.254</text><ellipse cx="430" cy="120" rx="34" ry="22" fill="#2c7a7b"/><text x="430.0" y="125.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">R1</text><line x1="132.0" y1="120.0" x2="396.0" y2="120.0" stroke="#2d3748" stroke-width="2"/><line x1="464.0" y1="120.0" x2="728.0" y2="120.0" stroke="#2d3748" stroke-width="2"/><text x="372.0" y="110.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">Fa0/0</text><text x="372.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#4a5568">.254</text><text x="488.0" y="110.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c53030">Fa1/0</text><text x="488.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#4a5568">.254</text><text x="250.0" y="110.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">192.168.1.0/24</text><text x="610.0" y="110.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b6cb0">192.168.2.0/24</text><rect x="325" y="185" width="210" height="66" rx="6" fill="#f7fafc" stroke="#a0aec0"/><text x="430.0" y="204.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1a202c">R1 routing table</text><text x="337.0" y="225.0" text-anchor="start" font-size="11" fill="#4a5568">C 192.168.1.0/24  Fa0/0</text><text x="337.0" y="243.0" text-anchor="start" font-size="11" fill="#4a5568">C 192.168.2.0/24  Fa1/0</text><line x1="140.0" y1="82.0" x2="400.0" y2="82.0" stroke="#38a169" stroke-width="2.5" marker-end="url(#ag)"/><text x="270.0" y="68.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#38a169">1-2  to 192.168.2.2: other subnet → default gateway</text><line x1="460.0" y1="82.0" x2="720.0" y2="82.0" stroke="#38a169" stroke-width="2.5" marker-end="url(#ag)"/><text x="590.0" y="68.0" text-anchor="middle" font-size="10.5" font-weight="700" fill="#38a169">3  match 192.168.2.0/24 → out Fa1/0</text><text x="430.0" y="300.0" text-anchor="middle" font-size="12" fill="#1a202c">1. H1 sends an IP packet to 192.168.2.2</text><text x="430.0" y="320.0" text-anchor="middle" font-size="12" fill="#1a202c">2. 192.168.2.2 is in another subnet, so H1 forwards it to its default gateway</text><text x="430.0" y="340.0" text-anchor="middle" font-size="12" fill="#1a202c">3. R1 finds 192.168.2.0/24 in its routing table and sends it out Fa1/0</text><text x="430.0" y="360.0" text-anchor="middle" font-size="12" fill="#1a202c">4. H2 receives the IP packet</text></svg>